[package]
name = "freehold-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "freehold"
path = "src/main.rs"

[dependencies]
freehold-installer = { path = "../installer" }
freehold-core = { path = "../core" }
freehold-orchestrator = { path = "../orchestrator" }
freehold-console-client = { path = "../console-client" }
anyhow = "1"
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
