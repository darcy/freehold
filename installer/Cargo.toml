[package]
name = "freehold-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "freehold-install"
path = "src/main.rs"

[dependencies]
freehold-core = { path = "../core" }
anyhow = "1"
dialoguer = "0.11"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
toml = "0.8"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
