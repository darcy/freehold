[package]
name = "freehold-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Freehold hermetic test fixtures: mock Vultr/B2 API servers and an in-process sshd"

[dependencies]
axum = "0.8"
ed25519-dalek = "3"
hex = "0.4"
parking_lot = "0.12"
rand = "0.9"
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process"] }

[lib]
name = "freehold_testkit"
