[package]
name = "freehold-acceptance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Freehold Chunk 1 acceptance script: the algolia-style happy path, all three connectors via the runner, and the G3 security invariants — hermetic, loopback-only"

[dependencies]
anyhow = "1"
axum = "0.8"
freehold-control-plane = { path = "../console" }
freehold-core = { path = "../core" }
freehold-runner = { path = "../runner" }
freehold-testkit = { path = "../testkit" }
hex = "0.4"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
ureq = { version = "3", features = ["json"] }
zeroize = "1"

[lib]
name = "freehold_acceptance"

[[bin]]
name = "acceptance"
path = "src/main.rs"
