[package]
name = "freehold-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Freehold runner: privileged MCP tool server (generic exec + owned connections)"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
freehold-core = { path = "../core" }
hex = "0.4"
parking_lot = "0.12"
rand = "0.9"
russh = { version = "0.62", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
ed25519-dalek = "3"
freehold-testkit = { path = "../testkit" }
tempfile = "3"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "runner"
path = "src/main.rs"
