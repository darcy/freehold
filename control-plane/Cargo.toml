[package]
name = "freehold-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Freehold control plane: secret provisioner, runner registry, local admin/ops surface"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
freehold-core = { path = "../core" }
hex = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
zeroize = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
freehold-runner = { path = "../runner" }
freehold-testkit = { path = "../testkit" }
libc = "0.2"
tempfile = "3"

[lib]
name = "freehold_control_plane"
path = "src/lib.rs"

[[bin]]
name = "control-plane"
path = "src/main.rs"
