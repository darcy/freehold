[package]
name = "freehold-console-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The freehold console API client — ONE contract shared by the web page and the TUI"
publish = false

[dependencies]
freehold-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
