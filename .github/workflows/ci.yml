name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The control-plane Go tests drive the Rust binaries built above
      # (target/debug/runner, target/debug/freehold-harness-oracle), so they run
      # here rather than in the independent Go matrix.
      - uses: actions/setup-go@v6
        with:
          go-version-file: "control-plane/go.mod"
          # A key unique to this job (control-plane isn't in the Go matrix), so
          # its deps cache without racing the matrix legs.
          cache-dependency-path: control-plane/go.mod

      - name: Go build (control-plane)
        working-directory: control-plane
        run: go build ./...

      - name: Go vet (control-plane)
        working-directory: control-plane
        run: go vet ./...

      - name: Go test (control-plane)
        working-directory: control-plane
        run: go test ./...

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [agents, contract, platform, install]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "control-plane/go.mod"
          # setup-go defaults to a repo-root go.mod, which this multi-module repo
          # doesn't have — without this it silently skips caching and recompiles
          # platform's dependency tree (lego + cloud DNS SDKs) every run. Key per
          # module: a shared '**/go.sum' key races across matrix legs and the
          # first finisher wins, leaving the big legs uncached.
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Go build (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Go vet (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Go test (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go test ./...

  # Fan-in so the required status check keeps its stable name (`check`) now that
  # the work is split across parallel jobs. A skipped required check counts as
  # passing, so this must fail loudly when a needed job does not succeed.
  check:
    if: always()
    needs: [rust, go]
    runs-on: ubuntu-latest
    steps:
      - name: Require rust and go to pass
        run: |
          echo "rust: ${{ needs.rust.result }}"
          echo "go: ${{ needs.go.result }}"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.go.result }}" = "success"
