name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The control-plane Go tests drive the Rust binaries (control-plane/acceptance
  # runs target/debug/runner; control-plane/core/harness runs
  # target/debug/freehold-harness-oracle), so this job builds just those two
  # before the Go checks. Keeping it separate lets the Rust and plain-Go jobs
  # stay independent and parallel.
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - uses: Swatinem/rust-cache@v2

      - name: Build runner + harness oracle
        run: cargo build -p freehold-runner -p freehold-harness-oracle

      - uses: actions/setup-go@v6
        with:
          go-version-file: "control-plane/go.mod"
          # setup-go defaults to a repo-root go.mod, which this multi-module repo
          # doesn't have — without this it silently skips caching and recompiles
          # the dependency tree every run.
          cache-dependency-path: control-plane/go.mod

      - name: Go build (control-plane)
        working-directory: control-plane
        run: go build ./...

      - name: Go vet (control-plane)
        working-directory: control-plane
        run: go vet ./...

      - name: Go test (control-plane)
        working-directory: control-plane
        run: go test ./...

  # The control-plane module is NOT in this matrix — it has its own job above
  # (it must build the Rust runner + harness oracle first). Its `go test ./...`
  # there runs the new no-cross-import guard (control-plane/isolation_test.go).
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [agents, contract, platform, providers, freehold-cli]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "control-plane/go.mod"
          # Key per module: a shared '**/go.sum' key races across matrix legs and
          # the first finisher wins, leaving the big legs (platform: lego + cloud
          # DNS SDKs) uncached.
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Go build (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Go vet (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Go test (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go test ./...

  # Fan-in so the required status check keeps its stable name (`check`) now that
  # the work is split across parallel jobs. A skipped required check counts as
  # passing, so this must fail loudly when a needed job does not succeed.
  check:
    if: always()
    needs: [rust, control-plane, go]
    runs-on: ubuntu-latest
    steps:
      - name: Require rust, control-plane, and go to pass
        run: |
          echo "rust: ${{ needs.rust.result }}"
          echo "control-plane: ${{ needs['control-plane'].result }}"
          echo "go: ${{ needs.go.result }}"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs['control-plane'].result }}" = "success"
          test "${{ needs.go.result }}" = "success"
