name: Bot Review

on:
  # pull_request_target ONLY, for every PR: the event runs in the base repo's
  # context, so checkout (no `ref:`) resolves to the BASE branch — the
  # workflow, review scripts, and npm deps all come from trusted main, and the
  # secrets are present with a writable token. The PR head contributes ONLY
  # the diff, fetched over the API (`pulls.listFiles`) — nothing from an
  # unreviewed head is ever checked out or executed, including for a fork PR.
  # (The `pull_request` event must NOT be used: its checkout resolves to the
  # PR merge ref, which would run the PR head's own scripts and deps with the
  # bot PAT and the provider key in env — a malicious PR could exfiltrate both
  # and post a self-approving review.)
  # Because the executed code comes from main, review-infra changes only go
  # live when they merge — a PR cannot exercise its own workflow revision.
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  bot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every PR revision is reviewed exactly once: `pull_request_target` is the
    # only trigger, so no author-based gating is needed. No `ref:` on the
    # checkout: on `pull_request_target` it resolves to the base branch
    # (trusted main) — review scripts, deps, and the prompt template all come
    # from main. `allow-unsafe-pr-checkout` is deliberately NOT set; the
    # reviewed diff comes from the API, never a head checkout.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: .github/scripts/ai-review/package-lock.json

      - name: Install deps
        working-directory: .github/scripts/ai-review
        run: npm ci

      # The review harness (opencode v2). Pinned version: a floating agent
      # binary inside a job that reviews untrusted PRs is a supply-chain
      # surface. The package's postinstall downloads the platform binary —
      # npm's allowScripts gate must permit it or the shim exits 1 with no
      # binary behind it.
      - name: Install opencode
        run: npm install -g --allow-scripts=@opencode/cli @opencode/cli@2.0.18

      - name: Run AI review
        working-directory: .github/scripts/ai-review
        env:
          # Token for comments + review-thread resolution. GITHUB_TOKEN is
          # forbidden from resolveReviewThread ("Resource not accessible by
          # integration"); use a PAT (classic `repo` scope, or fine-grained
          # "Pull requests: read/write" + "Issues: read/write") from a bot
          # account named 'Bot Review'. Reviews also author as that account.
          GITHUB_TOKEN: ${{ secrets.AI_REVIEW_BOT_TOKEN }}

          # ---- review harness config: this is the only provider-specific part ----
          # review.mjs runs opencode headless over the checked-out repo with
          # read-only tools (bash/edit/write denied in the harness process,
          # which never sees GITHUB_TOKEN). LLM_MODEL is the FULL opencode
          # model id (`<provider>/<model>`); LLM_KEY_ENV names the provider's
          # key env var and LLM_API_KEY its value.
          LLM_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          LLM_KEY_ENV: "FIREWORKS_API_KEY"
          LLM_MODEL: "fireworks-ai/accounts/fireworks/models/glm-5p3-flash"
          # TOTAL harness budget across both attempts (60/40 split).
          HARNESS_TIMEOUT_MS: "900000"
          # --------------------------------------------------------------------

          PROMPT_FILE: "review-prompt.md"
          CONTEXT_FILES: "AGENTS.md,README.md,docs/ARCHITECTURE.md"
          EXCLUDE_PATTERNS: "**/package-lock.json,**/*.lock,**/dist/**,**/vendor/**"
          MAX_DIFF_CHARS: "500000"
          MAX_CONTEXT_FILE_CHARS: "240000"
          FAIL_ON_OVERSIZED_DIFF: "true"
        run: node review.mjs
