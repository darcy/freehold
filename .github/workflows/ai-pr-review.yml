name: Bot Review

on:
  # `pull_request_target` ONLY — for every PR (same-repo, fork, Dependabot's;
  # no routing `if:`). Under this event the workflow YAML that runs always
  # comes from the base repo's default branch, so a PR can never rewrite the
  # `run:` blocks that review it — a `pull_request` trigger would re-open
  # exactly that hole (its YAML is the PR's merge-ref copy). The event context
  # carries the base repo's secrets, which review.mjs needs to post; a
  # fork/Dependabot-initiated `pull_request` run would get a read-only token
  # and no secrets, so there is nothing to route back to it for.
  # The event checkout below is the default branch (trusted main) — the
  # scripts, npm deps, and prompt template all run from it, and the agent
  # explores that same tree with read-only tools. The reviewed diff is fetched
  # over the API (`pulls.listFiles`). Nothing from an unreviewed head is ever
  # checked out, let alone executed; the only untrusted inputs are the diff
  # and prior comments, which reach the agent as prompt data.
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, review_requested]

concurrency:
  # One review per PR at a time, latest event wins: overlapping runs each post
  # their own verdict review (and a run's dismissal step executes before the
  # other run has posted, so two contradictory APPROVED/REQUEST_CHANGES can
  # coexist). Multiple events fire for a single push, and back-to-back pushes
  # overlap runs (each takes ~5 min) — without this group the PR can end on an
  # approval posted right under a NEEDS WORK summary from the same head.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  bot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The auto GITHUB_TOKEN is only used by the checkout (fetch). The review
    # posts through the bot PAT, so the auto token gets read-only contents and
    # nothing else — minimal blast radius if any executed code were ever
    # compromised.
    permissions:
      contents: read
    steps:
      # The explored repo AND the executed code — under `pull_request_target`
      # this checkout IS the base repo's default branch (trusted main). No
      # second checkout exists: there is nothing to separate it from.
      # persist-credentials: false — the default writes the token into this
      # tree's .git/config, a file inside the harness's read scope; the rule
      # holds regardless of what is checked out.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: .github/scripts/ai-review/package-lock.json

      - name: Install deps
        working-directory: .github/scripts/ai-review
        run: npm ci

      # The review harness (opencode v2). Pinned version: a floating agent
      # binary inside a job that reviews untrusted PRs is a supply-chain
      # surface. The package's postinstall downloads the platform binary —
      # npm's allowScripts gate must permit it or the shim exits 1 with no
      # binary behind it.
      # working-directory is the checked-out default branch: npm reads
      # ./.npmrc from the cwd, so the checkout this runs against must stay a
      # trusted-main checkout (it is — see the checkout step above).
      - name: Install opencode
        working-directory: .github/scripts/ai-review
        run: npm install -g --allow-scripts=@opencode/cli @opencode/cli@2.0.18

      - name: Run AI review
        working-directory: .github/scripts/ai-review
        env:
          # Token for comments + review-thread resolution. GITHUB_TOKEN is
          # forbidden from resolveReviewThread ("Resource not accessible by
          # integration"); use a PAT (classic `repo` scope, or fine-grained
          # "Pull requests: read/write" + "Issues: read/write") from a bot
          # account named 'Bot Review'. Reviews also author as that account.
          GITHUB_TOKEN: ${{ secrets.AI_REVIEW_BOT_TOKEN }}

          # ---- review harness config: this is the only provider-specific part ----
          # review.mjs runs opencode headless over the checked-out repo with
          # read-only tools (bash/edit/write denied in the harness process,
          # which never sees GITHUB_TOKEN). HARNESS_MODEL is the FULL opencode
          # model id (`<provider>/<model>`); LLM_KEY_ENV names the provider's
          # key env var and HARNESS_API_KEY its value.
          HARNESS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          HARNESS_MODEL: "fireworks-ai/accounts/fireworks/models/glm-5p3-flash"
          LLM_KEY_ENV: "FIREWORKS_API_KEY"
          # TOTAL harness budget across both attempts (60/40 split).
          HARNESS_TIMEOUT_MS: "1800000"

          # Shared review config (the legacy single-shot-reviewer vars are
          # gone — main's script is the harness script now): PROMPT_FILE,
          # CONTEXT_FILES, EXCLUDE_PATTERNS and the MAX_* limits below.
          PROMPT_FILE: "review-prompt.md"
          CONTEXT_FILES: "AGENTS.md,README.md,docs/ARCHITECTURE.md"
          EXCLUDE_PATTERNS: "**/package-lock.json,**/*.lock,**/dist/**,**/vendor/**"
          MAX_DIFF_CHARS: "500000"
          MAX_CONTEXT_FILE_CHARS: "240000"
          FAIL_ON_OVERSIZED_DIFF: "true"
        run: node review.mjs
