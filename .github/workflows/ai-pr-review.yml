name: DeepSeek AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  deepseek-review:
    runs-on: ubuntu-latest
    if: ${{ false }}
    # if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/ai-review/package-lock.json

      - name: Install deps
        working-directory: .github/scripts/ai-review
        run: npm ci

      - name: Run AI review
        working-directory: .github/scripts/ai-review
        env:
          # Token for comments + review-thread resolution. GITHUB_TOKEN is
          # forbidden from resolveReviewThread ("Resource not accessible by
          # integration"); use a PAT (classic `repo` scope, or fine-grained
          # "Pull requests: read/write" + "Issues: read/write") from a bot
          # account named 'DeepSeek'. Reviews also author as that account.
          GITHUB_TOKEN: ${{ secrets.AI_REVIEW_BOT_TOKEN }}

          # ---- provider config: this is the only provider-specific part ----
          LLM_BASE_URL: "https://api.fireworks.ai/inference/v1"
          LLM_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          LLM_MODEL: "accounts/fireworks/models/deepseek-v4-flash-0731"
          # --------------------------------------------------------------------

          PROMPT_FILE: "review-prompt.md"
          CONTEXT_FILES: "AGENTS.md,README.md,ARCHITECTURE.md"
          EXCLUDE_PATTERNS: "**/package-lock.json,**/*.lock,*.md,**/*.md,**/dist/**,**/vendor/**"
          MAX_DIFF_CHARS: "2560000"
          MAX_CONTEXT_FILE_CHARS: "80000"
          FAIL_ON_OVERSIZED_DIFF: "true"
        run: node review.mjs
