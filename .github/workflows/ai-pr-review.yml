name: DeepSeek AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  deepseek-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/ai-review/package-lock.json

      - name: Install deps
        working-directory: .github/scripts/ai-review
        run: npm ci

      - name: Run AI review
        working-directory: .github/scripts/ai-review
        env:
          # Comments author as this token's account. GITHUB_TOKEN posts as
          # 'github-actions[bot]'; swap to secrets.DEEPSEEK_BOT_TOKEN (a PAT from
          # a GitHub account/bot named 'DeepSeek', repo write + checks read) when
          # one exists so reviews author as that name.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ---- provider config: this is the only provider-specific part ----
          LLM_BASE_URL: "https://api.fireworks.ai/inference/v1"
          LLM_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          LLM_MODEL: "accounts/fireworks/models/deepseek-v4-flash-0731"
          # --------------------------------------------------------------------

          PROMPT_FILE: "review-prompt.md"
          CONTEXT_FILES: "AGENTS.md,README.md,ARCHITECTURE.md"
          EXCLUDE_PATTERNS: "**/package-lock.json,**/*.lock,**/*.md,**/dist/**,**/vendor/**"
          MAX_DIFF_CHARS: "60000"
          MAX_CONTEXT_FILE_CHARS: "20000"
          FAIL_ON_OVERSIZED_DIFF: "true"
        run: node review.mjs
