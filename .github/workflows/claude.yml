on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          allowed_bots: "dependabot[bot]"
          # Track review rounds in a single parent comment
          track_progress: true

          # Focused review: verifier-first, severity tiers, no nits
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Verifier: CI runs the repo's checks (cargo build / test / clippy /
            fmt) as a separate workflow. Read the PR's CI status with gh and
            cite it in the top-level summary ("CI: green", or the failing
            check). Treat CI results as authoritative — do not re-run cargo
            yourself; it is BLOCKING if CI is red.

            Scope: only real problems — security holes, data loss, silent
            failures, clear logic bugs, contract/API mismatches, tests that pass
            vacuously. Read AGENTS.md first: it locks the architecture. Flag
            violations of the locked model, but never re-litigate accepted
            decisions (e.g. JSON state store, rotation-as-re-issue,
            single-process state) unless they are actually wrong. No style,
            naming, comment-wording, or "could simplify" suggestions — no
            perfectionism.

            README drift (signal only, never a blocker): if this PR changes
            something the README documents (new subcommands, tools, crates,
            test counts, status lines, CLI shapes), add ONE line to the
            top-level comment under "README:" saying what should be updated.
            This is a signal for the developer to update or ignore — it is
            NEVER BLOCKING or IMPORTANT, never posted inline, and never
            nitpicked for wording. Mention it once per PR, not in re-review
            rounds.

            ARCHITECTURE drift (signal only, never a blocker): if this PR
            drifts from ARCHITECTURE.md — changes or violates something the
            architecture doc locks or documents (connector flavors, agent
            placement, secret paths, the readiness model, the provisioner /
            no-master-key shape) — add ONE line to the top-level comment
            under "ARCHITECTURE:" saying what should be updated or why the
            doc is now stale. Same rules as README drift: a signal, NEVER
            BLOCKING or IMPORTANT, never posted inline, never nitpicked for
            wording, mentioned once per PR (not in re-review rounds).

            Mermaid diagram accuracy (README): the README's sequence diagrams
            document real wiring — bootstrap (9007 create, 9000 put-user, the
            kind-13534 COMMUNITY membership layer via buzz-admin run in the
            relay LXC through the box runner, the A4 domain gate checked on the
            OPERATOR machine after a manual DNS mapping, relay LXC optional for
            the attach flow), runner setup + grant (channel membership vs the
            shipped-package grants path, secret sealed TO the runner's key), and
            the exec call path (roster whitelist read per call, detached 48001
            audit). When a PR edits a diagram or changes behavior those diagrams
            depict, verify the diagram against the code it claims to show —
            kinds, arrows, lifelines, and steps must match the actual flow (the
            mermaid grammar used is 10.9.1; DO NOT re-render it, review the
            claims). A diagram/code mismatch is IMPORTANT — it misdocuments the
            product for every future reader — and gets an inline comment on the
            diagram lines. Diagram layout, styling, or wording is NIT (silent).

            Severity tiers, stated in the top-level comment only:
            - BLOCKING: must fix before merge (security, data loss, silent breakage)
            - IMPORTANT: should fix in this PR (operator-facing wrong behavior,
              correctness edge, vacuous test)
            - DEFER: real but acceptable now — a named follow-up for the PR body
              or AGENTS.md known-gaps. Never block on it, never re-raise it in
              later rounds.
            - NIT: do not post. Nits stay silent.

            Post inline comments ONLY for BLOCKING and IMPORTANT items, on the
            exact lines. Everything else — including brief praise — goes in the
            single top-level comment.

            Re-review (synchronize pushes): scope each round to (1) whether the
            previous round's BLOCKING/IMPORTANT items are actually closed, and
            (2) genuine regressions introduced by the fix. Once no BLOCKING or
            IMPORTANT items remain, stop: do not keep finding marginal issues in
            code you already approved. Deferred items belong in AGENTS.md or the
            PR body as follow-ups, not in new review rounds.

            End the top-level comment with a one-line verdict:
            "MERGE-READY: <reason>" or "NEEDS WORK: <n> BLOCKING, <m> IMPORTANT"

          # Tools: review commands only — verification lives in CI
          # Sonnet 5 ($2/$10 per M tokens) instead of Opus ($5/$25)
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
