[package]
name = "freehold-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Freehold orchestrator: the scripted CPA stand-in that drives the engine room"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
freehold-control-plane = { path = "../control-plane" }
freehold-core = { path = "../core" }
hex = "0.4"
freehold-runner = { path = "../runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ureq = { version = "3", features = ["json"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "orchestrator"
path = "src/main.rs"
